name: Scrape yeezy.com

on:
  schedule:
    # Every 10 minutes, matching YEEZY_CHECK_INTERVAL=600 in .env.example.
    # GitHub Actions cron syntax can't read secrets/vars, so if you change
    # YEEZY_CHECK_INTERVAL, update this cron expression to match.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scraper-yeezy
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Yeezy scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper_job.py yeezy
